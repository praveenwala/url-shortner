# Four test layers, run and reported separately (Constitution Principle IV, R10).
# Integration and workflow layers use Testcontainers against real PostgreSQL —
# never an in-memory substitute (R3).
name: ci

on:
  push:
  pull_request:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "orchestrator[dev]"
      - name: Lint
        run: ruff check orchestrator
      - name: Unit
        run: pytest orchestrator/tests -m unit -q
      - name: Workflow
        run: pytest orchestrator/tests -m "workflow and not integration" -q
      - name: Integration
        run: pytest orchestrator/tests -m integration -q
      - name: Failure-path
        run: pytest orchestrator/tests -m failure -q
      - name: Contract parity
        # Fails if the published OpenAPI, the approved contract, and the running
        # application disagree — drift breaks the build rather than being noticed later.
        run: pytest orchestrator/tests -m contract -q

  shortener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Unit
        run: mvn -B -f shortener/pom.xml test -Dtest='**/unit/*Test'
      - name: Contract parity
        # Regenerates the OpenAPI document from the running application and fails if it
        # drifts from the approved contract or the committed artifact.
        run: mvn -B -f shortener/pom.xml test -Dtest='**/contract/*Test'
      - name: Integration + failure-path
        run: mvn -B -f shortener/pom.xml verify

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        # `npm ci` not `npm install`: it installs exactly the lockfile, so CI cannot silently
        # resolve a different dependency tree than the one that was reviewed.
        run: npm ci
        working-directory: console
      - name: Typecheck
        run: npx tsc -b --force
        working-directory: console
      - name: Unit
        run: npx vitest run
        working-directory: console
      - name: Build
        # Proves the production bundle actually compiles, not just that the tests pass.
        run: npm run build
        working-directory: console
