[project]
name = "orchestrator"
version = "0.1.0"
description = "Agentic SDLC orchestration service — dependency graph, gates, persisted state, audit"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "testcontainers[postgres]>=4.8", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure logic, no I/O",
    "integration: real PostgreSQL via Testcontainers",
    "workflow: full orchestration runs",
    "failure: failure-path behaviour",
    "contract: published contract matches the running application",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
